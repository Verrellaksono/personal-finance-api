services:
    postgres:
        image: postgres:16-alpine
        container_name: personal_finance_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: root
            POSTGRES_DB: personal_finance
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - finance-network

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: personal_finance_api
        ports:
            - "8080:8080"
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=root
            - DB_NAME=personal_finance
            - DB_SSLMODE=disable
            - APP_PORT=8080
        depends_on:
            - postgres
        restart: unless-stopped
        networks:
            - finance-network

volumes:
    pgdata:

networks:
    finance-network:
        driver: bridge
